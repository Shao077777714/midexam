<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>物品欄隔離測試資料</title>
<h1>物品欄顯示測試</h1><p>只可在隔離的本機測試來源使用。這是物品欄檢查點，不代表正常流程五關通關驗收。</p>
<button id="shadow">建立第一關物件檢查點</button>
<button id="shadow-done">建立第一關已解謎未開門檢查點</button>
<button id="dinner">建立第三關家庭照片檢查點</button>
<button id="board">建立第四關總機檢查點</button>
<button id="sky">建立第四關怪核天空檢查點</button>
<button id="seed">建立第五關物品欄檢查點</button>
<button id="final">建立第六關投信檢查點</button>
<button id="bag">建立第二關三物背包檢查點</button>
<button id="corridor">建立第二關雙擊拿取檢查點</button>
<script type="module">
import {RECORDINGS} from './puzzles.mjs';
import {newGame,applyAction,SHADOW_TARGETS,SEARCHES,RECORD_HIDES,saveGame} from './engine.mjs';
function seed(target){
  if(location.hostname!=='localhost'||!['4181','4182'].includes(location.port))throw Error('Use isolated localhost:4181 or :4182, never the player origin');
  let state=newGame();const act=a=>{const r=applyAction(state,a);if(!r.ok)throw Error(r.message);state=r.state;};
  const launch=()=>{if(!saveGame(localStorage,state).ok)throw Error('Save failed');location.href='./';};
  const next=()=>{act({type:'ACK_SAVE'});act({type:'OPEN_EXIT'});act({type:'ACK_SAVE'});act({type:'NEXT'});};
  act({type:'TRIGGER'});if(target===0){launch();return;}for(let i=0;i<3;i++)act({type:'SHADOW',index:i,...SHADOW_TARGETS[i]});if(target==='shadow-done'){launch();return;}next();
  if(target===1){launch();return;}
  act({type:'TRIGGER'});act({type:'CLOCK_SET',hour:8,minute:10});act({type:'SEARCH',id:'clock'});act({type:'CHAIR'});for(const id of ['key','drawing'])act({type:'COLLECT',id});for(const [index,value]of [1,0,2].entries())act({type:'SEAL_SET',index,value});act({type:'SEARCH',id:'letterbox'});act({type:'COLLECT',id:'letter'});if(target==='bag'){launch();return;}for(const id of ['key','drawing','letter'])act({type:'SLOT',slot:id,id});next();
  if(target===2){launch();return;}act({type:'TRIGGER'});for(const type of ['DRAWER','CHAIR','FRAME'])act({type});for(const id of SEARCHES[2])act({type:'SEARCH',id});for(let i=0;i<9;i++){act({type:'COLLECT',id:`p${i}`});act({type:'PHOTO',id:`p${i}`,slot:i,angle:0});}act({type:'PHOTO_READ'});next();
  if(target===3||target==='sky'){if(target==='sky')act({type:'TRIGGER'});launch();return;}
  act({type:'TRIGGER'});for(const id of Object.values(RECORD_HIDES))act({type:'SEARCH',id});for(const t of RECORDINGS)act({type:'COLLECT',id:t.id});for(let index=0;index<RECORDINGS.length;index++)act({type:'RECORD_ORDER',index});act({type:'ACTIVATE_BOARD'});next();
  if(target===5){act({type:'TRIGGER'});for(const id of ['lamp-crate','linen-box','power-radio'])act({type:'SEARCH',id});for(const [index,id]of ['bulb','shade','battery'].entries()){act({type:'COLLECT',id});act({type:'INSTALL',index,id});}for(let slot=0;slot<9;slot++){const index=state.levels[4].circuit.indexOf(slot);if(index!==slot)act({type:'CIRCUIT_SWAP',index,slot});}for(let index=0;index<9;index++)while(state.levels[4].circuitAngles[index]!== (index===0?90:0))act({type:'CIRCUIT_ROTATE',index});for(let index=0;index<3;index++)act({type:'LAMP',index});act({type:'PROJECT'});act({type:'PROJECTION_END'});next();}
  launch();
}
document.querySelector('#bag').onclick=()=>seed('bag');
document.querySelector('#final').onclick=()=>seed(5);
document.querySelector('#sky').onclick=()=>seed('sky');
document.querySelector('#board').onclick=()=>seed(3);
document.querySelector('#shadow').onclick=()=>seed(0);
document.querySelector('#shadow-done').onclick=()=>seed('shadow-done');
document.querySelector('#dinner').onclick=()=>seed(2);
document.querySelector('#seed').onclick=()=>seed(4);
document.querySelector('#corridor').onclick=()=>seed(1);
</script></html>
