<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e8d9d3"><meta name="description" content="夢隙：醒來之前。在夢核與怪核之間，找回五片記憶。第一人稱 3D 密室逃脫遊戲。">
  <title>夢隙：醒來之前</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="world" aria-label="第一人稱 3D 遊戲場景"></canvas>
  <div id="eye-overlay" aria-hidden="true"></div>
  <div id="grain" aria-hidden="true"></div><div id="vignette" aria-hidden="true"></div><div id="transition" aria-hidden="true"></div>
  <header id="hud" hidden>
    <div class="chapter"><span id="chapter-no">場景 01 / 06</span><h1 id="chapter-name">失焦的房間</h1><span id="world-state" class="world-state">DREAMCORE · 夢核</span></div>
    <nav id="quick-controls" class="hud-actions" aria-label="遊戲調整區">
      <span class="controls-caption">遊戲調整</span>
      <div class="controls-buttons">
        <button id="hint-button" class="icon-button" aria-label="任務提示 H" data-tip="任務提示 · H"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6m-5 3h4M8 14a6 6 0 1 1 8 0c-1 1-1 2-1 2H9s0-1-1-2Z"/></svg></button>
        <button id="sound-button" class="icon-button" aria-label="關閉聲音" aria-pressed="false" data-tip="聲音開啟 · 點擊關閉"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 4-6 5H2v6h3l6 5Z"/><path class="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="disabled-mark" d="m3 3 18 18"/></svg></button>
        <button id="effects-button" class="icon-button" aria-label="關閉眼睛與水面動態特效" aria-pressed="false" data-tip="動態特效開啟 · 點擊關閉"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2.5 6.5L21 11l-6.5 2.5L12 20l-2.5-6.5L3 11l6.5-2.5ZM20 2v4m-2-2h4"/><path class="disabled-mark" d="m3 3 18 18"/></svg></button>
        <button id="inventory-button" class="icon-button" aria-label="物品欄 Tab" aria-expanded="false" aria-controls="panel" data-tip="物品欄 · Tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1M7 6H5v13h2M17 6h2v13h-2M7 10a5 5 0 0 1 10 0v11H7ZM7 11h10M9 15h6v4H9Z"/></svg></button>
        <button id="pause-button" class="icon-button" aria-label="暫停遊戲" data-tip="暫停 · Esc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
      </div>
    </nav>
  </header>
  <aside id="memory-hud" hidden><p class="eyebrow">MEMORY FRAGMENTS</p><div id="memory-icons"></div><small id="save-status">每關完成後自動儲存</small></aside>
  <div id="movement-state" role="status"></div>
  <div id="crosshair" aria-hidden="true" hidden>+</div>
  <button id="interact" class="interact" hidden><span id="interact-name"></span></button>
  <footer id="control-bar" hidden><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動</span><span>滑鼠直接環視 · Alt 切換游標</span><span>雙擊拿取／互動 · <kbd>E</kbd> 也可 <kbd>R</kbd> 檢視 <kbd>G</kbd> 放下</span></footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <section id="title-screen" class="title-screen">
    <div class="title-top"><span>DREAM GAP</span><span>一段關於遺忘與清醒的記憶</span></div>
    <div class="title-copy"><p class="eyebrow">A DREAMCORE ESCAPE EXPERIENCE</p><h1>夢隙<span>醒來之前</span></h1><p class="title-quote">有些地方，你從未到過，<br>卻記得回家的路。</p><div class="title-buttons"><button id="new-game" class="primary" disabled>載入記憶中……</button><button id="continue-game" class="secondary" hidden>繼續上一次的記憶</button></div><p id="load-message" class="muted"></p></div>
    <div class="title-bottom"><span>六個場景，五片記憶。<br>找到真相，才找得到出口。</span><span>鍵盤與滑鼠 · 滑鼠環視 · Alt 游標 · 建議戴上耳機<br>約 25 分鐘的探索旅程</span></div>
  </section>
  <section id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden><header><div><p id="panel-kicker" class="eyebrow">MEMORY</p><h2 id="panel-title"></h2></div><button id="panel-close" class="round" aria-label="關閉操作介面">×</button></header><div id="panel-body"></div></section>
  <section id="modal" class="modal-wrap" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden><article class="modal"><p id="modal-kicker" class="eyebrow"></p><h2 id="modal-title"></h2><div id="modal-body"></div><div id="modal-actions" class="modal-actions"></div></article></section>
  <div id="fatal" class="fatal" role="alert" hidden><h2>這段記憶暫時無法顯示</h2><p id="fatal-message"></p><button onclick="location.reload()" class="primary">重新載入</button></div>
  <noscript>請啟用 JavaScript 以進入 3D 遊戲。</noscript>
  <script type="module" src="game.mjs"></script>
</body>
</html>
